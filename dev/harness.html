<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hass-custom harness</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px 12px;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
      }
      #toolbar {
        display: flex;
        gap: 8px;
      }
      #toolbar button {
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid rgba(127, 127, 127, 0.4);
        background: rgba(255, 255, 255, 0.7);
        cursor: pointer;
        font: inherit;
      }
      #card,
      #card-lights,
      #card-purifier,
      #card-tv,
      #card-tv-steppers,
      #card-tv-bravia,
      #card-washer,
      #card-doors,
      #card-last-seen,
      #card-last-seen-strict {
        width: 100%;
        max-width: 400px;
      }
      /* Deliberately wider than the rest: ru-tv-card switches to its
         side-by-side layout on its OWN width (a container query), so the suite
         needs two differently sized mounts on one page to tell that apart from
         a viewport media query. max-width, not a hard width, so this doesn't
         overflow the 390px mobile project and shift the other cards. */
      #card-tv-wide {
        width: 100%;
        max-width: 900px;
      }
      /* Deliberately narrower than the rest: the volume −/+ nudges reveal on
         the controls row's OWN width (a nested container query), so the suite
         needs a mount where the row stays too narrow in both viewport
         projects. */
      #card-tv-narrow {
        width: 100%;
        max-width: 320px;
      }
      /* ru-nav-card shows every label once its OWN width reaches 600px, so
         one slot stays compact and one is wide enough for the labels (on the
         desktop project — the 390px mobile viewport keeps both compact). */
      #card-nav {
        width: 100%;
        max-width: 360px;
      }
      #card-nav-wide {
        width: 100%;
        max-width: 720px;
      }
      /* The shutters and lights cards split into list | pane on their OWN
         width (720px+), so each gets a second, wide mount (desktop project
         only — the 390px mobile viewport keeps them narrow). */
      #card-shutters-wide,
      #card-lights-wide {
        width: 100%;
        max-width: 1040px;
      }
      /* Compact summaries: the lights one phone-sized, the shutters one in a
         wide slot so its overlay drilldown is checked past the 720px split
         width (desktop project). */
      #card-lights-compact {
        width: 100%;
        max-width: 360px;
      }
      #card-shutters-compact {
        width: 100%;
        max-width: 1040px;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="toggle-dark">Toggle dark</button>
      <button id="reset">Reset</button>
    </div>
    <div id="card"></div>
    <div id="card-lights"></div>
    <div id="card-purifier"></div>
    <div id="card-tv"></div>
    <div id="card-tv-steppers"></div>
    <div id="card-tv-bravia"></div>
    <div id="card-tv-wide"></div>
    <div id="card-tv-narrow"></div>
    <div id="card-washer"></div>
    <div id="card-doors"></div>
    <div id="card-last-seen"></div>
    <div id="card-last-seen-strict"></div>
    <div id="card-nav"></div>
    <div id="card-nav-wide"></div>
    <div id="card-shutters-wide"></div>
    <div id="card-lights-wide"></div>
    <div id="card-lights-compact"></div>
    <div id="card-shutters-compact"></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
