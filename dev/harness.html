<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hass-custom harness</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px 12px;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
      }
      #toolbar {
        display: flex;
        gap: 8px;
      }
      #toolbar button {
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid rgba(127, 127, 127, 0.4);
        background: rgba(255, 255, 255, 0.7);
        cursor: pointer;
        font: inherit;
      }
      #card,
      #card-lights,
      #card-purifier,
      #card-tv,
      #card-tv-steppers,
      #card-tv-bravia {
        width: 100%;
        max-width: 400px;
      }
      /* Deliberately wider than the rest: ru-tv-card switches to its
         side-by-side layout on its OWN width (a container query), so the suite
         needs two differently sized mounts on one page to tell that apart from
         a viewport media query. max-width, not a hard width, so this doesn't
         overflow the 390px mobile project and shift the other cards. */
      #card-tv-wide {
        width: 100%;
        max-width: 900px;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="toggle-dark">Toggle dark</button>
      <button id="reset">Reset</button>
    </div>
    <div id="card"></div>
    <div id="card-lights"></div>
    <div id="card-purifier"></div>
    <div id="card-tv"></div>
    <div id="card-tv-steppers"></div>
    <div id="card-tv-bravia"></div>
    <div id="card-tv-wide"></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
